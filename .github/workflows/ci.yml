name: CI

# Checks every pull request. publish.yml reuses the tests job (workflow_call)
# for pushes to main and releases, so an image is never published from untested code.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# A newer push to the same PR or branch supersedes the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same Python as the Docker image (docker/Dockerfile: python:3.11-slim).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements-dev.txt

      # Catches syntax errors in modules no test imports.
      - name: Compile all modules
        run: python -m compileall -q core web tools plexcache.py

      - run: python -m pytest tests/ -q

  docker-build:
    name: Docker build
    # Publishing builds the image itself; this check is for pull requests.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          cache-from: type=gha
