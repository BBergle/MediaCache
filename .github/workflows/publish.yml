name: Publish image

# ghcr.io/<owner>/mediacache
#   push to main          -> :latest, :sha-<short>
#   release vX.Y.Z        -> :X.Y.Z, :X.Y, :X, :latest
#   manual run            -> :latest, :sha-<short> (rebuild without a code change)
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# Two merges landing close together: the newer one wins :latest.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build and push
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mediacache
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short,enable=${{ github.event_name != 'release' }}
            type=raw,value=latest,enable=${{ github.event_name != 'release' || !github.event.release.prerelease }}

      # IMAGE_TAG is shown in the web UI: the version for releases, "latest" otherwise.
      - id: image_tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
            echo "value=${tag#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=latest" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          provenance: false
          sbom: false
          # Docker v2 manifests, not OCI: Unraid's update check only asks for
          # Docker media types and reports "not available" for OCI-only images.
          outputs: type=image,oci-mediatypes=false,push=true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            IMAGE_TAG=${{ steps.image_tag.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
